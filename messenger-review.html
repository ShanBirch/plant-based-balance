<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Balance · Messenger review</title><link rel="stylesheet" href="/css/messenger-review.css"></head>
<body><main><header><p class="eyebrow">BALANCE · MESSENGER</p><h1>Review conversation</h1><p>Only the controlled test conversation appears here.</p></header>
<form id="login"><label for="code">Review access code</label><input id="code" type="password" autocomplete="off" required maxlength="64"><button>Open review inbox</button></form>
<p id="status" role="status" aria-live="polite">Enter the access code provided with your review instructions.</p>
<section id="inbox" hidden><nav><button id="refresh" type="button">Refresh conversation</button><button id="lock" type="button">Lock inbox</button></nav><h2>Balance APP · Test conversation</h2><div id="messages" aria-label="Test conversation messages"></div>
<form id="compose"><label for="draft">Review reply</label><textarea id="draft" rows="5" maxlength="1800"></textarea><button id="send" disabled>Send reviewed reply</button><p class="note">Sends to this test conversation only. Replies require a recent incoming message.</p></form></section>
</main><script src="/js/messenger-review.js" defer></script></body></html>
