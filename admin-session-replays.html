<main>
<header><div><a href="/admin-dashboard.html">Balance Admin</a><h1>Session replays</h1></div><button id="theme" type="button">Switch theme</button></header>
<p>Review the taps, scrolling and screen changes before a problem. Private text and media are hidden. Replays expire after seven days.</p>
<p id="status" role="status">Checking your admin access…</p>
<section id="workspace" hidden>
<form id="search-form"><label for="search">Find a member</label><div class="search-row"><input id="search" type="search" placeholder="Member name" maxlength="100"><button type="submit">Search</button><button id="refresh" type="button">Refresh</button></div></form>
<div class="layout"><section aria-label="Recent sessions"><div id="sessions"></div><button id="older" type="button" hidden>Load older sessions</button></section>
<section class="playback" aria-label="Replay player"><h2 id="session-title">Choose a session</h2><p id="session-detail">New sessions appear here after a member uses the updated app.</p>
<div id="controls" hidden><div class="buttons"><button id="play" type="button">Play</button><button id="pause" type="button">Pause</button><label>Speed <select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label></div>
<label for="seek">Playback position <output id="time">0:00</output></label><input id="seek" type="range" value="0" min="0" max="1" step="100" aria-label="Playback position">
<div id="errors" class="buttons"></div></div><div id="player"></div></section></div>
</section></main></body></html>
