name: Build iOS App

on:
  # Build when you push to main
  push:
    branches: [main]
  # Also allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # --- Code Signing Setup ---
      # Decode the .cer certificate, private key, and provisioning profile from GitHub Secrets,
      # create a .p12 from them, install into a temporary keychain so xcodebuild can sign the app.
      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          # Decode files from base64 secrets
          CERT_PATH=$RUNNER_TEMP/distribution.cer
          KEY_PATH=$RUNNER_TEMP/signing_key.pem
          P12_PATH=$RUNNER_TEMP/build_certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$SIGNING_KEY_BASE64" | base64 --decode -o $KEY_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH

          # Convert .cer (DER) to .pem
          openssl x509 -inform DER -in $CERT_PATH -out $RUNNER_TEMP/distribution.pem

          # Download Apple WWDR intermediate certificates (required for valid chain)
          curl -sL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/AppleWWDRCAG3.cer
          curl -sL https://www.apple.com/appleca/AppleIncRootCertificate.cer -o $RUNNER_TEMP/AppleRoot.cer

          # Convert intermediate certs to PEM
          openssl x509 -inform DER -in $RUNNER_TEMP/AppleWWDRCAG3.cer -out $RUNNER_TEMP/AppleWWDRCAG3.pem
          openssl x509 -inform DER -in $RUNNER_TEMP/AppleRoot.cer -out $RUNNER_TEMP/AppleRoot.pem

          # Create certificate chain file
          cat $RUNNER_TEMP/AppleWWDRCAG3.pem $RUNNER_TEMP/AppleRoot.pem > $RUNNER_TEMP/chain.pem

          # Create .p12 with legacy encryption (required for macOS Keychain compatibility)
          openssl pkcs12 -export \
            -out $P12_PATH \
            -inkey $KEY_PATH \
            -in $RUNNER_TEMP/distribution.pem \
            -certfile $RUNNER_TEMP/chain.pem \
            -password pass:"$P12_PASSWORD" \
            -legacy 2>/dev/null || \
          openssl pkcs12 -export \
            -out $P12_PATH \
            -inkey $KEY_PATH \
            -in $RUNNER_TEMP/distribution.pem \
            -certfile $RUNNER_TEMP/chain.pem \
            -password pass:"$P12_PASSWORD"

          # Create a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import Apple root and intermediate certificates into our keychain
          security import $RUNNER_TEMP/AppleRoot.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign -T /usr/bin/security
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign -T /usr/bin/security

          # Import distribution certificate into keychain
          security import $P12_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Add both our keychain and system keychain to the search list
          # The system keychain contains Apple's root CAs needed for trust chain
          security list-keychain -d user -s $KEYCHAIN_PATH /Library/Keychains/System.keychain

          # Verify the signing identity is available
          security find-identity -v -p codesigning $KEYCHAIN_PATH

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # --- Build signed IPA for real devices ---
      - name: Build iOS app (signed for device)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM="BPDFP9M7JU" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="Balance App Store" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>BPDFP9M7JU</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.fitgotchi.app</key>
                  <string>Balance App Store</string>
              </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      # --- Verify signing ---
      - name: Verify IPA signing
        run: |
          # Check what the IPA is signed with
          mkdir -p $RUNNER_TEMP/ipa_check
          unzip -q "$RUNNER_TEMP/export/App.ipa" -d $RUNNER_TEMP/ipa_check
          codesign -dvvv $RUNNER_TEMP/ipa_check/Payload/App.app 2>&1 || true

      # --- Upload to TestFlight ---
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          # Decode the App Store Connect API key
          API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o $API_KEY_PATH

          # Create API key directory for xcrun
          mkdir -p ~/.private_keys
          cp $API_KEY_PATH ~/.private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8

          # Validate the IPA first
          xcrun altool --validate-app \
            -f "$RUNNER_TEMP/export/App.ipa" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

          # Upload to TestFlight
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/App.ipa" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      # Keep the IPA as a downloadable artifact
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: balance-ios
          path: ${{ runner.temp }}/export/App.ipa
          retention-days: 30

      # --- Cleanup ---
      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
