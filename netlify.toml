# Fitbit scheduled sync - runs every 2 hours
[functions."sync-fitbit-data"]
  schedule = "0 */2 * * *"

# All wearables scheduled sync - runs every 2 hours (offset by 1 hour from Fitbit)
[functions."sync-wearable-data"]
  schedule = "0 1-23/2 * * *"

# Meal reminders - schedule is defined inline in send-meal-reminders.mjs via export config
# Runs every 10 minutes to check if any users need meal reminders

# Onboarding sequence scheduled scan - days 3/7/14/30 check-ins
# Runs every 4 hours at :17 to stagger from the pulse scans and sync jobs.
[functions."onboarding-scheduled-scan"]
  schedule = "17 */4 * * *"

# ============================================================
# Daily pulses. Kept quiet so Shannon only gets phone pushes for overdue DMs
# and explicit wins, not general "client has not trained" coaching ideas.
# The shared runner also mutes non-DM/non-win pulse pushes as a safety net.
# ============================================================

# Morning pulse - daily at 19:30 UTC (≈ 5:30 AEST / 6:30 AEDT).
# No proactive phone pushes.
[functions."pulse-morning"]
  schedule = "30 19 * * *"

# Lunch pulse - daily at 02:30 UTC (≈ 12:30 AEST / 13:30 AEDT).
# Overdue in-app DM safety net only.
[functions."pulse-lunch"]
  schedule = "30 2 * * *"

# Evening pulse - daily at 09:00 UTC (≈ 19:00 AEST / 20:00 AEDT).
# Overdue in-app DMs plus PB/streak/level-up backup only.
[functions."pulse-evening"]
  schedule = "0 9 * * *"

# Weekly Wrapped user push - Saturday 23:00 UTC (Sun 09:00 Brisbane).
# One push per active user linking into the Spotify-Wrapped-style recap.
# The push is a pinger only — client fetches the week's aggregate on open.
[functions."weekly-wrapped-push"]
  schedule = "0 23 * * 6"

# Independent weekly-goal rewards. The database applies XP only after each
# member's local Sunday has ended, and safely tops up late wearable syncs.
[functions."award-weekly-goal-rewards"]
  schedule = "*/15 * * * *"

# Auto feed reactions - hourly scanner, code gates to 07:30-21:45 Brisbane.
# Adds one Shannon love reaction to fresh feed posts after a human-ish delay.
[functions."auto-feed-comment"]
  schedule = "37 * * * *"

# Tahlia seeded social drafts - queues approval-only Feed posts/comments into Needs You.
[functions."tahlia-social-worker"]
  schedule = "*/20 * * * *"

# Weekly coach digest - Sunday evening 20:37 UTC (≈ Mon 06:37 AEST / 07:37 AEDT).
# Per-client planning report for Shannon. Not sent to clients.
# Disabled 2026-07-06 at Shannon's request: these Monday morning planning
# digests were filling Needs You with weekly check-ins.
# [functions."weekly-coach-digest"]
#   schedule = "37 20 * * 0"

# Meal plan nutrition audit - daily at 20:12 UTC (≈ 6:12 AEST / 7:12 AEDT).
# Internal safety net for active client plans: calories, macro math, row counts,
# and material gaps against stored/latest quiz targets.
[functions."meal-plan-nutrition-audit"]
  schedule = "12 20 * * *"

# Weekly check-in - ongoing weekly drafts for post-onboarding clients (31+ days).
# Monday 21:23 UTC (≈ Tue 07:23 AEST / 08:23 AEDT) — lands in the morning for
# Shannon to review. Staggered from the Sunday digest so two scans don't stack.
# Legacy only now. The Mon/Sun cohort workflow below replaces this scheduled run.
# [functions."weekly-checkin-scan"]
#   schedule = "23 21 * * 1"

# Challenge check-ins are retired for now because the community is carrying
# engagement without the Monday-morning and Sunday Needs You DM batches.
# Keep this dormant configuration for a simple re-enable when needed.
# [functions."challenge-checkin-scan"]
#   schedule = "30 19 * * 0,6"

# Challenge leaderboard refresher - releases future-dated seed/test activity
# by timestamp and keeps active participant rows current without a page open.
[functions."challenge-progress-refresh"]
  schedule = "17,47 * * * *"

# Plateau detection - weekly scan for post-day-30 clients whose weight/strength
# has stalled. Wed 22:47 UTC (≈ Thu 08:47 AEST) — mid-week, clear of Sun digest
# and Tue weekly check-in.
[functions."plateau-detection-scan"]
  schedule = "47 22 * * 3"

# Cohort acceptance window — expires participants who didn't tap Accept inside
# their 24-hour confirm window after the cohort filled to 6. Runs hourly at :43
# (staggered off the other scheduled jobs).
[functions."expire-cohort-acceptances"]
  schedule = "43 * * * *"

# IG/FB lead memory extractor — daily at :29, summarises new
# conversation context for any ig_thread with inbound activity since its
# last extraction. Builds the same `goals / communication_style /
# running_notes / injuries_limits / personal_context` shape as
# client_memory, so buildMemoryBlock works against either source.
# Extracted memory is injected into the IG-draft prompt for cold leads
# who haven't yet signed up to the app.
[functions."schedule-ig-thread-memory"]
  schedule = "29 */4 * * *"

# Daily message learning - nightly safety net for sent client/lead DMs.
# Runs at 23:41 Brisbane (13:41 UTC) and backfills any missed edit-learning
# or in-app client_memory extraction from the last day of sent coach_alerts.
[functions."daily-message-learning"]
  schedule = "41 13 * * *"

# Instagram content memory - keeps active story/post context fresh for IG drafts.
[functions."meta-ig-sync-content"]
  schedule = "*/15 * * * *"

# Instagram Graph inbox reconcile - polls recent Graph conversations so missed
# webhook events are recovered without ManyChat.
[functions."meta-ig-reconcile-inbox"]
  schedule = "*/5 * * * *"

# Instagram comment reply worker - polls recent shan_n_sunny media comments,
# waits a short human-ish delay, then posts one deduped Graph comment reply.
[functions."meta-ig-comment-reply-worker"]
  schedule = "* * * * *"

# Content Radar - mines recent DMs and IG feedback into daily post ideas.
[functions."content-radar-generate"]
  schedule = "45 19 * * *"

# Cross-platform content growth loop - snapshots IG/YouTube/TikTok post metrics
# and writes a compact brief for the content automation to read.
[functions."content-growth-scan"]
  schedule = "12 */6 * * *"

# Coco's reward learner - scores the scoped acquisition lane and updates only
# Coco's active learned rules. Runs daily in lean-cost mode.
[functions."cocos-learning-run"]
  schedule = "55 18 * * *"

# Automated YouTube reel outreach is intentionally disabled. The function is
# also hard-stopped in its handler so a manual invocation cannot send a reel.

# Client/lead manager - routes genuine holds into Needs You and provides a
# cloud fallback for clean reviewed unlinked-lead replies when the local
# final-review manager is unavailable. Runs 24 hours a day.
[functions."client-lead-manager"]
  schedule = "*/10 * * * *"

# Support Radar - daily human-support pass across app activity + chats.
# Creates only high-signal Needs You check-ins, capped and deduped.
[functions."support-radar-scan"]
  schedule = "17 20 * * *"

# Automated YouTube reel recommendations are intentionally disabled. Manual
# YouTube links in normal coach messages are unaffected.

# Recent Workout Touch - catches fresh completed workouts and creates at most a
# weekly Needs You message per client, only during Shannon's waking hours.
[functions."recent-workout-touch-scan"]
  schedule = "*/15 * * * *"

# Story comment quality audit - daily soft review of story-comment replies that
# look confused or mismatched. Netlify cron is UTC: 21:08 UTC = 7:08am Brisbane.
[functions."story-comment-quality-audit"]
  schedule = "8 21 * * *"

# ManyChat reconcile is intentionally unscheduled for IG Graph cutover. Keep the
# function file for manual legacy rescue until the external ManyChat account is
# fully disconnected.

# Scheduled coach-reply worker — fires Send-later drafts whose timer has
# elapsed. Cadence is every minute so latency between "send in 5 min" and
# actual send is at most ~60 seconds. Function early-returns when nothing is
# due (one cheap status=scheduled query, no further work), so per-minute is
# safe on Netlify's quota. Backed by coach_alerts.scheduled_for + an atomic
# claim flip ('scheduled' -> 'pending') so concurrent runs don't double-fire.
# Delivery runs 24 hours so the 24-hour DM manager cannot create an overnight backlog.
[functions."scheduled-coach-reply-worker"]
  schedule = "* * * * *"

# Preserve and re-analyze inbound Instagram media whose first CDN download or
# transcription attempt failed. Drafting stays blocked until media is ready.
[functions."ig-media-retry-worker"]
  schedule = "* * * * *"

# Abbey game autoplayer - schedules and fires delayed Shannon turns in
# Connect 4 / Tic Tac Toe without touching normal DM auto-send.
[functions."game-autoplay-worker"]
  schedule = "* * * * *"

# Prevent caching of service worker so native app always gets latest version
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Prevent Android WebView HTTP cache from serving stale HTML to the service worker
# The SW's Cache API handles offline caching separately — this only affects the HTTP cache layer
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Allow JS/CSS to be stored but force validation on each app open. This keeps
# native users on the latest deploy without paying a full re-download when
# Netlify can answer with a 304.
[[headers]]
  for = "/lib/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/dashboard/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/dashboard/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

