<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t"><title id="t">Electrical within a neuron, chemical across a synapse</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#80601f"/></marker></defs><rect width="600" height="400" rx="24" fill="#fffdf7"/><g font-family="Arial,sans-serif" font-size="23" fill="#25251f"><rect x="40" y="55" width="225" height="70" rx="18" fill="#f4e4b9" stroke="#80601f" stroke-width="2"/><text x="152.5" y="97" text-anchor="middle">Neuron 1</text><rect x="335" y="55" width="225" height="70" rx="18" fill="#f4e4b9" stroke="#80601f" stroke-width="2"/><text x="447.5" y="97" text-anchor="middle">Neuron 2</text><path d="M100 165L240 165" stroke="#80601f" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="150" y="204" text-anchor="middle" font-size="19">Electrical pulse</text><text x="150" y="230" text-anchor="middle" font-size="19">along the axon</text><path d="M285 165L318 165" stroke="#80601f" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="417" y="204" text-anchor="middle" font-size="19">Chemical message</text><text x="417" y="230" text-anchor="middle" font-size="19">across the gap</text><text x="300" y="292" text-anchor="middle" font-size="19">Synapse = connection between cells</text><text x="300" y="344" text-anchor="middle" font-size="19">The next cell responds</text></g></svg>
