<template id="balance-motion-template">
  <div id="balance-motion" data-composition-id="balance-motion" data-start="0" data-duration="15" data-fps="30" data-width="1080" data-height="1920">
    <div class="scene-fill deep-bg"></div>
    <div id="orb-a" class="orb orb-a" data-layout-ignore></div>
    <div id="orb-b" class="orb orb-b" data-layout-ignore></div>
    <div class="ghost-word" data-layout-ignore>BALANCE</div>
    <div class="top-rule" data-layout-ignore data-layout-allow-occlusion="true"></div>
    <div class="micro micro-top" data-layout-allow-occlusion="true">YOUR FITNESS. ONE CLEAR PATH.</div>

    <section id="scene-plan" class="feature-scene">
      <div class="app-card"><img class="focus-bottom" src=".media/images/home-goals-challenge.jpg" alt="Balance weekly goals" /></div>
      <div class="copy-card"><small>PLAN</small><strong>A clear focus,<br />every week.</strong></div>
    </section>

    <section id="scene-learn" class="feature-scene">
      <div class="app-card"><img src=".media/images/learn-topics.jpg" alt="Balance learning topics" /></div>
      <div class="copy-card"><small>LEARN</small><strong>Know what moves<br />you forward.</strong></div>
    </section>

    <section id="scene-share" class="feature-scene share-scene">
      <div id="share-walk" class="app-card share-card"><img src=".media/images/feed-walk.jpg" alt="Walk shared to Balance" /></div>
      <div id="share-food" class="app-card share-card"><img src=".media/images/feed-food.jpg" alt="Food shared to Balance" /></div>
      <div id="share-workout" class="app-card share-card"><img src=".media/images/feed-workout.jpg" alt="Workout shared to Balance" /></div>
      <div class="copy-card"><small>SHARE</small><strong>Meals. Walks. Workouts.<br />Together.</strong></div>
    </section>

    <section id="scene-track" class="feature-scene">
      <div class="app-card"><img src=".media/images/nutrition-tracker.jpg" alt="Balance nutrition tracker" /></div>
      <div class="copy-card"><small>TRACK</small><strong>Nutrition without<br />the guesswork.</strong></div>
    </section>

    <section id="scene-train" class="feature-scene">
      <div class="app-card"><img src=".media/images/movement-coach.jpg" alt="Train with Coach Shannon" /></div>
      <div class="copy-card"><small>TRAIN</small><strong>Your coach in<br />your corner.</strong></div>
    </section>

    <section id="scene-compete" class="feature-scene">
      <div class="app-card"><img class="focus-top" src=".media/images/challenge-friends.jpg" alt="Balance challenge with friends" /></div>
      <div class="copy-card"><small>COMPETE</small><strong>With friends.<br />Stay motivated.</strong></div>
    </section>

    <div id="brand-bg" class="brand-bg" data-layout-allow-overflow="true"></div>
    <div id="brand-lockup" class="brand-lockup">
      <div id="logo-glow" class="logo-glow" data-layout-ignore></div>
      <img id="balance-logo" src=".media/images/logo_001.png" alt="Balance harmony logo" />
      <div id="brand-promise">EVERYTHING YOU NEED<br />TO STAY CONSISTENT.</div>
      <div id="brand-name">BALANCE</div>
      <div id="brand-tagline">Fitness Gamified</div>
      <div id="brand-cta"><span>JOIN BALANCE</span><i data-layout-allow-overflow="true"></i></div>
    </div>

    <style>
      #balance-motion {
        --bg: #0c0714;
        --surface: #21122f;
        --purple: #6f42c1;
        --gold: #f7b51e;
        --ivory: #f7f2e8;
        --ink: #160d20;
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: "Montserrat", sans-serif;
        color: #fff;
        isolation: isolate;
      }
      #balance-motion * { box-sizing: border-box; }
      .scene-fill { position: absolute; inset: 0; }
      .deep-bg { background-color: var(--bg); }
      .orb { position: absolute; border-radius: 999px; filter: blur(18px); opacity: 0.22; }
      .orb-a { width: 680px; height: 680px; left: -310px; top: 160px; background: radial-gradient(circle, rgba(111,66,193,.95), rgba(111,66,193,0)); }
      .orb-b { width: 780px; height: 780px; right: -390px; bottom: -80px; background: radial-gradient(circle, rgba(247,181,30,.72), rgba(247,181,30,0)); }
      .ghost-word { position: absolute; left: -90px; top: 700px; font: 400 250px/1 "League Gothic", sans-serif; letter-spacing: .03em; color: rgba(247,242,232,.09); transform: rotate(-90deg); transform-origin: center; }
      .top-rule { position: absolute; z-index: 20; left: 74px; right: 74px; top: 136px; height: 3px; background-color: var(--gold); opacity: .75; }
      .micro { position: absolute; z-index: 20; font: 800 24px/1 "Montserrat", sans-serif; letter-spacing: .12em; color: var(--ivory); white-space: nowrap; }
      .micro-top { left: 74px; top: 88px; }
      .feature-scene { position: absolute; z-index: 4; inset: 0; opacity: 0; visibility: hidden; }
      .app-card {
        position: absolute;
        left: 190px;
        top: 190px;
        width: 700px;
        height: 1390px;
        overflow: hidden;
        border-radius: 58px;
        border: 3px solid rgba(255,255,255,.22);
        background-color: var(--surface);
        box-shadow: 0 38px 100px rgba(0,0,0,.52);
        transform-origin: 50% 50%;
      }
      .app-card::after { content: ""; position: absolute; inset: 0; border-radius: 55px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.08), inset 0 70px 120px rgba(255,255,255,.035); pointer-events: none; }
      .app-card img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
      .app-card img.focus-bottom { object-position: center bottom; }
      .app-card img.focus-top { object-position: center top; }
      .copy-card {
        position: absolute;
        z-index: 12;
        left: 82px;
        right: 82px;
        bottom: 160px;
        min-height: 238px;
        padding: 36px 46px 38px;
        border-radius: 42px;
        background-color: rgba(12,7,20,.94);
        border: 2px solid rgba(247,181,30,.55);
        box-shadow: 0 28px 70px rgba(0,0,0,.48);
      }
      .copy-card small { display: block; margin-bottom: 16px; color: var(--gold); font: 700 25px/1 "Space Mono", monospace; letter-spacing: .18em; }
      .copy-card strong { display: block; color: var(--ivory); font-size: 60px; line-height: 1.02; font-weight: 900; letter-spacing: -.035em; }
      .share-card { width: 610px; height: 1260px; left: 235px; top: 218px; }
      .brand-bg { position: absolute; z-index: 30; left: 50%; top: 50%; width: 1250px; height: 1250px; margin: -625px 0 0 -625px; border-radius: 50%; background-color: var(--ivory); transform: scale(0); }
      .brand-lockup { position: absolute; z-index: 34; inset: 0; color: var(--ink); pointer-events: none; opacity: 0; visibility: hidden; }
      .logo-glow { position: absolute; top: 350px; left: 335px; width: 410px; height: 410px; border-radius: 50%; background: radial-gradient(circle, rgba(247,181,30,.48), rgba(247,181,30,0)); opacity: 0; }
      #balance-logo { position: absolute; left: 345px; top: 340px; width: 390px; height: 390px; object-fit: contain; border-radius: 50%; }
      #brand-promise { position: absolute; left: 120px; right: 120px; top: 790px; text-align: center; font: 700 35px/1.25 "Space Mono", monospace; letter-spacing: .08em; color: #5a4168; }
      #brand-name { position: absolute; left: 0; right: 0; top: 940px; text-align: center; font-size: 118px; line-height: .9; font-weight: 900; letter-spacing: -.045em; white-space: nowrap; }
      #brand-tagline { position: absolute; left: 0; right: 0; top: 1090px; text-align: center; font: 700 48px/1.1 "Space Mono", monospace; color: #4b355a; }
      #brand-cta { position: absolute; left: 360px; top: 1235px; width: 360px; height: 104px; display: grid; place-items: center; overflow: hidden; border-radius: 54px; background-color: var(--ink); color: var(--ivory); }
      #brand-cta span { position: relative; z-index: 2; font-size: 28px; font-weight: 900; letter-spacing: .08em; }
      #brand-cta i { display: none; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#orb-a", { x: 0, y: 0, scale: 1 }, { x: 52, y: -38, scale: 1.08, duration: 2.5, yoyo: true, repeat: 5, ease: "sine.inOut" }, .1);
      tl.fromTo("#orb-b", { x: 0, y: 0, rotation: 0 }, { x: -42, y: 34, rotation: 8, duration: 2.4, yoyo: true, repeat: 5, ease: "sine.inOut" }, .14);

      const enterScene = (id, at, fromX) => {
        tl.set(id, { autoAlpha: 1 }, at);
        tl.fromTo(`${id} .app-card`, { autoAlpha: 0, x: fromX, y: 105, scale: .84, rotation: fromX < 0 ? -5 : 5 }, { autoAlpha: 1, x: 0, y: 0, scale: 1, rotation: 0, duration: .48, ease: "back.out(1.35)" }, at);
        tl.fromTo(`${id} .copy-card`, { autoAlpha: 0, y: 72, scale: .9 }, { autoAlpha: 1, y: 0, scale: 1, duration: .38, ease: "expo.out" }, at + .35);
        tl.fromTo(`${id} .copy-card small`, { autoAlpha: 0, x: -28 }, { autoAlpha: 1, x: 0, duration: .26, ease: "power4.out" }, at + .47);
      };
      const exitScene = (id, at, toX) => {
        tl.fromTo(`${id} .copy-card`, { autoAlpha: 1, y: 0, scale: 1 }, { autoAlpha: 0, y: -36, scale: 1, duration: .2, ease: "power2.in" }, at);
        tl.fromTo(`${id} .app-card`, { autoAlpha: 1, x: 0, y: 0, scale: 1, rotation: 0 }, { autoAlpha: 0, x: toX, y: -70, scale: .88, rotation: toX < 0 ? -4 : 4, duration: .36, ease: "power3.in" }, at);
        tl.set(id, { autoAlpha: 0 }, at + .38);
      };

      enterScene("#scene-plan", .18, -150);
      exitScene("#scene-plan", 1.9, -140);

      enterScene("#scene-learn", 1.9, 150);
      tl.fromTo("#scene-learn .app-card", { scale: 1 }, { scale: 1.025, duration: 1.25, ease: "sine.inOut" }, 2.35);
      exitScene("#scene-learn", 3.65, 140);

      tl.set("#scene-share", { autoAlpha: 1 }, 3.65);
      tl.fromTo("#share-walk", { autoAlpha: 0, x: -170, y: 120, scale: .8, rotation: -8 }, { autoAlpha: 1, x: -90, y: -20, scale: .91, rotation: -6, duration: .44, ease: "back.out(1.4)" }, 3.65);
      tl.fromTo("#share-food", { autoAlpha: 0, x: 160, y: 120, scale: .8, rotation: 8 }, { autoAlpha: 1, x: 85, y: 10, scale: .92, rotation: 6, duration: .44, ease: "back.out(1.4)" }, 4.08);
      tl.fromTo("#share-workout", { autoAlpha: 0, y: 140, scale: .8 }, { autoAlpha: 1, y: 0, scale: 1, duration: .46, ease: "back.out(1.45)" }, 4.5);
      tl.fromTo("#scene-share .copy-card", { autoAlpha: 0, y: 72, scale: .9 }, { autoAlpha: 1, y: 0, scale: 1, duration: .38, ease: "expo.out" }, 4.78);
      tl.fromTo("#scene-share .copy-card small", { autoAlpha: 0, x: -28 }, { autoAlpha: 1, x: 0, duration: .26, ease: "power4.out" }, 4.9);
      exitScene("#scene-share", 5.95, -150);

      enterScene("#scene-track", 5.95, 150);
      exitScene("#scene-track", 7.7, 140);

      enterScene("#scene-train", 7.7, -150);
      tl.fromTo("#scene-train .app-card", { scale: 1 }, { scale: 1.025, duration: 1.2, ease: "sine.inOut" }, 8.15);
      exitScene("#scene-train", 9.45, -140);

      enterScene("#scene-compete", 9.45, 150);
      exitScene("#scene-compete", 11.25, 140);

      tl.fromTo("#brand-bg", { scale: 0 }, { scale: 2.85, duration: .86, ease: "power4.inOut" }, 11.18);
      tl.fromTo("#brand-lockup", { autoAlpha: 0 }, { autoAlpha: 1, duration: .5, ease: "power3.out" }, 11.72);
      tl.fromTo("#logo-glow", { autoAlpha: 0 }, { autoAlpha: .8, duration: .5, ease: "sine.out" }, 11.72);
      tl.fromTo("#brand-lockup", { autoAlpha: 1 }, { autoAlpha: 1, duration: 2.77, ease: "none" }, 12.22);

      window.__timelines["balance-motion"] = tl;
      tl.seek(0);
    </script>
  </div>
</template>
