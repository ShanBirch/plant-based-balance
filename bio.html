<!DOCTYPE html>
<html lang="en">
<head>

    <script>
        (function () {
            try {
                var savedTheme = localStorage.getItem('userThemePreference');
                var theme = (savedTheme === 'light' || savedTheme === 'antigravity-light')
                    ? 'light'
                    : 'dark';
                document.documentElement.setAttribute('data-bio-theme', theme);
            } catch (error) {
                document.documentElement.setAttribute('data-bio-theme', 'dark');
            }
            document.documentElement.classList.add('reveal-ready');
        })();
    </script>
    <link rel="stylesheet" href="bio.css">
    <script src="bio-animations.js" defer></script>
</head>

                <div class="hub-links">
