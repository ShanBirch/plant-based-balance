<!doctype html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0F1110}body{font-family:Arial,sans-serif}.cover{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0F1110}.hero{position:absolute;left:0;top:0;width:1080px;height:1080px;object-fit:cover;object-position:48% 50%}.hero-shade{position:absolute;inset:0 0 auto;height:1080px;background:linear-gradient(180deg,rgba(15,17,16,.12),rgba(15,17,16,.04) 48%,rgba(15,17,16,.8) 100%)}.label{position:absolute;left:58px;top:82px;padding:15px 20px;border:3px solid #D7A94C;background:#0F1110;color:#D7A94C;font:700 25px Consolas,monospace;letter-spacing:.12em}.card{position:absolute;left:0;right:0;top:860px;height:850px;padding:72px 62px;background:#F4F0E6;color:#0F1110;border-top:14px solid #D7A94C}.headline{font:900 133px/.79 Impact,'Arial Narrow',sans-serif;letter-spacing:-.01em;text-transform:uppercase}.headline .gold{display:block;color:#9B6D13}.rule{width:100%;height:10px;margin:52px 0 34px;background:#D7A94C}.proof-label{font:700 25px Consolas,monospace;letter-spacing:.13em;color:#66501F}.proof{margin-top:12px;font:900 118px/.88 Impact,'Arial Narrow',sans-serif}.proof span{color:#9B6D13}.footer{position:absolute;left:0;right:0;bottom:0;height:210px;display:flex;align-items:center;padding:30px 62px;background:#0F1110;color:#F4F0E6}.logo{width:138px;height:138px;object-fit:contain}.brand{margin-left:28px}.brand-name{font:900 46px Impact,'Arial Narrow',sans-serif;letter-spacing:.02em}.brand-line{margin-top:9px;color:#D7A94C;font:700 18px Consolas,monospace;letter-spacing:.12em}
</style>
<style>.headline{line-height:.84}.headline span{display:block}</style>
</head>
<body>
<div class="cover">
  <img class="hero" src="assets/images/cover-150kg-depth.jpg" alt="Shane at the bottom of a 150 kilogram front squat">
  <div class="hero-shade"></div><div class="label">CLIENT PROGRESS</div>
  <section class="card">
    <div class="headline">SHANE'S<span>FRONT SQUAT</span><span class="gold">JOURNEY.</span></div>
    <div class="rule"></div><div class="proof-label">THE RESULT</div><div class="proof">150 KG <span>× 2</span></div>
  </section>
  <footer class="footer"><img class="logo" src="assets/balance-logo.png" alt="Balance"><div class="brand"><div class="brand-name">BALANCE</div><div class="brand-line">PLANT-BASED COACHING</div></div></footer>
</div>
</body>
</html>
