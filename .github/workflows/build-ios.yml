name: Build iOS App

on:
  # Build when you push to main
  push:
    branches: [main]
  # Also allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the IPA to TestFlight
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ITMS-90725: Apple requires builds to use iOS 26 SDK (Xcode 26+) for
      # uploads starting April 28, 2026. Pick the highest Xcode 26.x on the runner
      # rather than relying on the runner's default `xcode-select` (often older).
      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26 found on runner. Installed Xcodes:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
            exit 1
          fi
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # --- Code Signing Setup ---
      # Decode the .cer certificate, private key, and provisioning profiles from GitHub Secrets,
      # create a .p12 from them, install into a temporary keychain so xcodebuild can sign the app.
      - name: Install Apple certificate and provisioning profiles
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.BUILD_WIDGET_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          # Decode files from base64 secrets
          CERT_PATH=$RUNNER_TEMP/distribution.cer
          KEY_PATH=$RUNNER_TEMP/signing_key.pem
          P12_PATH=$RUNNER_TEMP/build_certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          WIDGET_PROFILE_PATH=$RUNNER_TEMP/build_widget_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$SIGNING_KEY_BASE64" | base64 --decode -o $KEY_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH
          echo -n "$WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $WIDGET_PROFILE_PATH

          # Convert .cer (DER) to .pem
          openssl x509 -inform DER -in $CERT_PATH -out $RUNNER_TEMP/distribution.pem

          # Download Apple WWDR intermediate certificates (required for valid chain)
          curl -sL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/AppleWWDRCAG3.cer
          curl -sL https://www.apple.com/appleca/AppleIncRootCertificate.cer -o $RUNNER_TEMP/AppleRoot.cer

          # Convert intermediate certs to PEM
          openssl x509 -inform DER -in $RUNNER_TEMP/AppleWWDRCAG3.cer -out $RUNNER_TEMP/AppleWWDRCAG3.pem
          openssl x509 -inform DER -in $RUNNER_TEMP/AppleRoot.cer -out $RUNNER_TEMP/AppleRoot.pem

          # Create certificate chain file
          cat $RUNNER_TEMP/AppleWWDRCAG3.pem $RUNNER_TEMP/AppleRoot.pem > $RUNNER_TEMP/chain.pem

          # --- Diagnostic: Verify certificate details ---
          echo "=== Certificate Subject ==="
          openssl x509 -in $RUNNER_TEMP/distribution.pem -noout -subject
          echo "=== Certificate Issuer ==="
          openssl x509 -in $RUNNER_TEMP/distribution.pem -noout -issuer
          echo "=== Certificate Validity ==="
          openssl x509 -in $RUNNER_TEMP/distribution.pem -noout -dates
          echo "=== Certificate Type (look for 'Apple Distribution') ==="
          openssl x509 -in $RUNNER_TEMP/distribution.pem -noout -subject | grep -i "distribution" && echo "✅ Certificate IS a Distribution certificate" || echo "❌ WARNING: Certificate may NOT be a Distribution certificate!"

          # --- Diagnostic: Verify private key matches certificate ---
          CERT_MODULUS=$(openssl x509 -in $RUNNER_TEMP/distribution.pem -noout -modulus 2>/dev/null | openssl md5)
          KEY_MODULUS=$(openssl rsa -in $KEY_PATH -noout -modulus 2>/dev/null | openssl md5)
          echo "=== Key Match Verification ==="
          echo "Certificate modulus hash: $CERT_MODULUS"
          echo "Private key modulus hash:  $KEY_MODULUS"
          if [ "$CERT_MODULUS" = "$KEY_MODULUS" ]; then
            echo "✅ Private key MATCHES the certificate"
          else
            echo "❌ FATAL: Private key does NOT match the certificate!"
            echo "This means the CSR used to generate the certificate was created with a DIFFERENT private key"
            echo "than the one stored in SIGNING_KEY_BASE64."
            echo "You need to either:"
            echo "  1. Use the correct private key that generated the original CSR, OR"
            echo "  2. Generate a new private key + CSR, revoke the old cert, and create a new one in Apple Developer portal"
            exit 1
          fi

          # Create .p12 with legacy encryption (required for macOS Keychain compatibility)
          openssl pkcs12 -export \
            -out $P12_PATH \
            -inkey $KEY_PATH \
            -in $RUNNER_TEMP/distribution.pem \
            -certfile $RUNNER_TEMP/chain.pem \
            -password pass:"$P12_PASSWORD" \
            -legacy 2>/dev/null || \
          openssl pkcs12 -export \
            -out $P12_PATH \
            -inkey $KEY_PATH \
            -in $RUNNER_TEMP/distribution.pem \
            -certfile $RUNNER_TEMP/chain.pem \
            -password pass:"$P12_PASSWORD"

          # Create a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import Apple root and intermediate certificates into our keychain
          security import $RUNNER_TEMP/AppleRoot.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign -T /usr/bin/security
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign -T /usr/bin/security

          # Import distribution certificate into keychain
          security import $P12_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Add both our keychain and system keychain to the search list
          # The system keychain contains Apple's root CAs needed for trust chain
          security list-keychain -d user -s $KEYCHAIN_PATH /Library/Keychains/System.keychain

          # Verify the signing identity is available
          echo "=== Signing Identities in Keychain ==="
          security find-identity -v -p codesigning $KEYCHAIN_PATH
          IDENTITY_COUNT=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -c "valid identities found")
          echo "=== Checking for valid codesigning identity ==="
          security find-identity -v -p codesigning $KEYCHAIN_PATH | grep "Apple Distribution" && echo "✅ Apple Distribution identity found" || echo "❌ WARNING: No Apple Distribution identity found!"

          # Install the main app and widget provisioning profiles.
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/Balance.mobileprovision
          cp "$WIDGET_PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/BalanceNutritionWidget.mobileprovision

          APP_PROFILE_XML=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null)
          WIDGET_PROFILE_XML=$(security cms -D -i "$WIDGET_PROFILE_PATH" 2>/dev/null)

          echo "=== App profile entitlements ==="
          echo "$APP_PROFILE_XML" | grep -B1 -A2 "healthkit\|application-groups\|aps-environment\|UUID\|Name\b" | head -80 || true
          for entitlement in \
            "com.apple.developer.healthkit" \
            "aps-environment" \
            "com.apple.security.application-groups"
          do
            if ! echo "$APP_PROFILE_XML" | grep -q "$entitlement"; then
              echo "::error::App provisioning profile secret is missing entitlement: $entitlement"
              echo "Regenerate the Balance App Store profile after enabling HealthKit, Push, and App Groups, then update BUILD_PROVISION_PROFILE_BASE64."
              exit 1
            fi
          done

          echo "=== Widget profile entitlements ==="
          echo "$WIDGET_PROFILE_XML" | grep -B1 -A2 "application-groups\|UUID\|Name\b" | head -60 || true
          if ! echo "$WIDGET_PROFILE_XML" | grep -q "com.apple.security.application-groups"; then
            echo "::error::Widget provisioning profile secret is missing App Groups entitlement"
            echo "Regenerate the BalanceNutritionWidget App Store profile after enabling App Groups, then update BUILD_WIDGET_PROVISION_PROFILE_BASE64."
            exit 1
          fi

      # --- Build signed IPA for real devices ---
      # Archive unsigned first, then let exportArchive perform App Store
      # distribution signing. This avoids certificate/profile creation during
      # archive while still letting export validate the final signed IPA.
      - name: Build iOS app (signed for device)
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        working-directory: ios/App
        run: |
          # Install API key so xcodebuild can talk to App Store Connect
          mkdir -p ~/.private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          # NOTE: Archive unsigned so the runner does not try to create
          # development certificates/profiles. exportArchive performs App Store
          # signing with the installed distribution certificate.
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -authenticationKeyPath ~/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          echo ""
          echo "=================================================="
          echo "=== UNSIGNED ARCHIVE CREATED ==="
          echo "=================================================="
          APP_PATH="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App.app not found at $APP_PATH"
            exit 1
          fi
          echo "Unsigned archive app exists. Final signed IPA entitlements are checked after export."

      - name: Export IPA
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_APP_PROFILE_SPECIFIER: ${{ vars.IOS_APP_PROFILE_SPECIFIER }}
          IOS_WIDGET_PROFILE_SPECIFIER: ${{ vars.IOS_WIDGET_PROFILE_SPECIFIER }}
        run: |
          mkdir -p ~/.private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          APP_PROFILE_SPECIFIER="${IOS_APP_PROFILE_SPECIFIER:-Balance}"
          WIDGET_PROFILE_SPECIFIER="${IOS_WIDGET_PROFILE_SPECIFIER:-BalanceNutritionWidget}"

          cat > $RUNNER_TEMP/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>BPDFP9M7JU</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.fitgotchi.app</key>
                  <string>${APP_PROFILE_SPECIFIER}</string>
                  <key>com.fitgotchi.app.BalanceNutritionWidget</key>
                  <string>${WIDGET_PROFILE_SPECIFIER}</string>
              </dict>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -authenticationKeyPath ~/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Verify exported IPA entitlements
        run: |
          IPA_PATH="$RUNNER_TEMP/export/App.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            echo "::error::IPA not found at $IPA_PATH"
            exit 1
          fi

          CHECK_DIR="$RUNNER_TEMP/ipa-check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          unzip -q "$IPA_PATH" -d "$CHECK_DIR"

          APP_PATH=$(find "$CHECK_DIR/Payload" -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::No .app found inside exported IPA"
            exit 1
          fi

          EXPORTED_ENTITLEMENTS="$RUNNER_TEMP/exported-entitlements.plist"
          codesign -d --entitlements :- "$APP_PATH" > "$EXPORTED_ENTITLEMENTS" 2>/dev/null
          cat "$EXPORTED_ENTITLEMENTS"

          for entitlement in \
            "com.apple.developer.healthkit" \
            "aps-environment" \
            "com.apple.security.application-groups"
          do
            if ! grep -q "$entitlement" "$EXPORTED_ENTITLEMENTS"; then
              echo "::error::Missing entitlement in exported IPA: $entitlement"
              exit 1
            fi
          done

          if [ ! -f "$APP_PATH/embedded.mobileprovision" ]; then
            echo "::error::Exported IPA is missing embedded.mobileprovision"
            exit 1
          fi

          PROFILE_XML=$(security cms -D -i "$APP_PATH/embedded.mobileprovision" 2>/dev/null)
          echo "$PROFILE_XML" | grep -B1 -A2 "healthkit\|application-groups\|aps-environment\|UUID\|Name\b" | head -60 || true

          for entitlement in \
            "com.apple.developer.healthkit" \
            "aps-environment" \
            "com.apple.security.application-groups"
          do
            if ! echo "$PROFILE_XML" | grep -q "$entitlement"; then
              echo "::error::Exported provisioning profile is missing entitlement: $entitlement"
              exit 1
            fi
          done

      - name: Upload IPA to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight }}
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_APPLE_ID: "6761238161"
        run: |
          IPA_PATH="$RUNNER_TEMP/export/App.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            echo "::error::IPA not found at $IPA_PATH"
            exit 1
          fi

          mkdir -p ~/.private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          set +e
          UPLOAD_OUTPUT=$(API_PRIVATE_KEYS_DIR="$HOME/.private_keys" xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apple-id "$APP_STORE_APPLE_ID" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --output-format xml 2>&1)
          UPLOAD_EXIT=$?
          set -e

          echo "$UPLOAD_OUTPUT"

          if [ "$UPLOAD_EXIT" -ne 0 ] || echo "$UPLOAD_OUTPUT" | grep -Eiq "UPLOAD FAILED|ERROR:|Validation failed|ITMS-"; then
            echo "::error::App Store Connect upload failed"
            exit 1
          fi

      # Keep the IPA as a downloadable artifact
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-ios
          path: ${{ runner.temp }}/export/App.ipa
          retention-days: 30

      # --- Cleanup ---
      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
