  <script>
    (() => {
      const composition = document.querySelector('[data-composition-id="05-progress-build"]');
      const select = (selector) => composition.querySelector(selector);
      const selectAll = (selector) => Array.from(composition.querySelectorAll(selector));
      const timeline = gsap.timeline({ paused: true });

      window.__timelines = window.__timelines || {};
      window.__timelines["05-progress-build"] = timeline;

      const ring = select('[id="f05-progress-build-ring-fill"]');
      const ringLength = ring.getTotalLength();
      ring.style.strokeDasharray = String(ringLength);
      ring.style.strokeDashoffset = String(ringLength);

      timeline.fromTo('[class~="f05-progress-build-heading"]', {
        opacity: 0,
        y: 24
      }, {
        opacity: 1,
        y: 0,
        duration: 0.46,
        ease: "power2.out"
      }, 0.04);
      timeline.fromTo('[class~="f05-progress-build-heading-rule"]', {
        scaleX: 0
      }, {
        scaleX: 1,
        duration: 0.52,
        ease: "power2.out"
      }, 0.10);
      timeline.fromTo('[class~="f05-progress-build-ring-card"]', {
        opacity: 0,
        scale: 0.94
      }, {
        opacity: 1,
        scale: 1,
        duration: 0.48,
        ease: "power2.out"
      }, 0.06);
      timeline.to(ring, {
        strokeDashoffset: ringLength * 0.28,
        duration: 1.14,
        ease: "power2.out"
      }, 0.18);
      timeline.fromTo('[class~="f05-progress-build-calendar"]', {
        opacity: 0,
        scale: 0.78
      }, {
        opacity: 1,
        scale: 1,
        duration: 0.44,
        ease: "power2.out"
      }, 0.74);

      const rows = selectAll('[class~="f05-progress-build-row"]');
      const rowStarts = [1.50, 2.18, 2.86];
      rows.forEach((row, index) => {
        const start = rowStarts[index];
        const fill = row.querySelector('[class~="f05-progress-build-fill"]');
        const fillState = Number(fill.dataset.fill);
        timeline.fromTo(row, {
          opacity: 0,
          x: 34,
          scale: 0.98
        }, {
          opacity: 1,
          x: 0,
          scale: 1,
          duration: 0.48,
          ease: "power2.out"
        }, start);
        timeline.fromTo(fill, {
          scaleX: 0
        }, {
          scaleX: fillState,
          duration: 0.78,
          ease: "power2.out"
        }, start + 0.14);
      });

      const outer = select('[class~="f05-progress-build-zoom-outer"]');
      const inner = select('[class~="f05-progress-build-zoom-inner"]');
      const target = select('[id="f05-progress-build-target"]');
      const frameRect = composition.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const targetOffsetX = targetRect.left + targetRect.width / 2 - (frameRect.left + frameRect.width / 2);
      const targetOffsetY = targetRect.top + targetRect.height / 2 - (frameRect.top + frameRect.height / 2);
      const maxScale = Math.min(
        (0.88 * frameRect.width) / targetRect.width,
        (0.88 * frameRect.height) / targetRect.height
      );
      const zoomScale = Math.min(1.55, maxScale);

      timeline.fromTo(target, {
        opacity: 0,
        scale: 0.92
      }, {
        opacity: 1,
        scale: 1,
        duration: 0.84,
        ease: "power2.out"
      }, 3.55);
      timeline.to(outer, {
        scale: zoomScale,
        duration: 1.25,
        ease: "power3.inOut"
      }, 3.80);
      timeline.to(inner, {
        x: -targetOffsetX,
        y: -targetOffsetY,
        duration: 1.25,
        ease: "power3.inOut"
      }, 3.80);
      timeline.fromTo('[class~="f05-progress-build-movement-image"]', {
        scale: 1.08
      }, {
        scale: 1,
        duration: 1.25,
        ease: "power3.inOut"
      }, 3.80);
      timeline.fromTo('[class~="f05-progress-build-chip"]', {
        opacity: 0,
        y: 14,
        scale: 0.94

        opacity: 1,
        y: 0,
        scale: 1,
        duration: 0.42,
        ease: "power2.out",
        stagger: 0.18
      }, 4.42);
      timeline.fromTo('[class~="f05-progress-build-final-line"]', {
        opacity: 0,
        x: -16
      }, {
        opacity: 1,
        x: 0,
        duration: 0.60,
        ease: "power2.out"
      }, 5.20);
