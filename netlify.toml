# Fitbit scheduled sync - runs every 2 hours
[functions."sync-fitbit-data"]
  schedule = "0 */2 * * *"

# All wearables scheduled sync - runs every 2 hours (offset by 1 hour from Fitbit)
[functions."sync-wearable-data"]
  schedule = "0 1-23/2 * * *"

# Meal reminders - schedule is defined inline in send-meal-reminders.mjs via export config
# Runs every 10 minutes to check if any users need meal reminders

# Onboarding sequence scheduled scan - days 3/7/14/30 check-ins
# Runs hourly at :17 to stagger from the pulse scans and sync jobs.
[functions."onboarding-scheduled-scan"]
  schedule = "17 * * * *"

# ============================================================
# Daily pulses — three-times-a-day scan that replaces the old
# 2-hourly ai-client-monitor + morning-pulse-scan. Each pulse
# runs a time-of-day-appropriate signal set; shared runner
# applies dormant / recently-contacted / 48h cooldown gates.
# ============================================================

# Morning pulse - daily at 19:30 UTC (≈ 5:30 AEST / 6:30 AEDT).
# Plan-the-day signals: missed scheduled workout, streak break,
# shared-challenge banter, cycle check-in, mood low, momentum.
[functions."pulse-morning"]
  schedule = "30 19 * * *"

# Lunch pulse - daily at 02:30 UTC (≈ 12:30 AEST / 13:30 AEDT).
# Mid-day engagement: unread DMs (safety net), check-in due,
# nutrition gap, meal dropoff, wearable low, quiet client.
[functions."pulse-lunch"]
  schedule = "30 2 * * *"

# Evening pulse - daily at 09:00 UTC (≈ 19:00 AEST / 20:00 AEDT).
# Reflect & reset: inactive client, challenge dropout,
# not-in-challenge, workout dropoff, wins backup (PB/streak/
# level-up/comeback), unread DMs.
[functions."pulse-evening"]
  schedule = "0 9 * * *"

# Weekly Wrapped user push - Sunday 07:00 UTC (≈ Sun 17:00 AEST / 18:00 AEDT).
# One push per active user linking into the Spotify-Wrapped-style recap.
# The push is a pinger only — client fetches the week's aggregate on open.
[functions."weekly-wrapped-push"]
  schedule = "0 7 * * 0"

# Weekly coach digest - Sunday evening 20:37 UTC (≈ Mon 06:37 AEST / 07:37 AEDT).
# Per-client planning report for Shannon. Not sent to clients.
[functions."weekly-coach-digest"]
  schedule = "37 20 * * 0"

# Weekly check-in - ongoing weekly drafts for post-onboarding clients (31+ days).
# Monday 21:23 UTC (≈ Tue 07:23 AEST / 08:23 AEDT) — lands in the morning for
# Shannon to review. Staggered from the Sunday digest so two scans don't stack.
[functions."weekly-checkin-scan"]
  schedule = "23 21 * * 1"

# Plateau detection - weekly scan for post-day-30 clients whose weight/strength
# has stalled. Wed 22:47 UTC (≈ Thu 08:47 AEST) — mid-week, clear of Sun digest
# and Tue weekly check-in.
[functions."plateau-detection-scan"]
  schedule = "47 22 * * 3"

# Cohort acceptance window — expires participants who didn't tap Accept inside
# their 24-hour confirm window after the cohort filled to 6. Runs hourly at :43
# (staggered off the other scheduled jobs).
[functions."expire-cohort-acceptances"]
  schedule = "43 * * * *"

# IG/FB lead memory extractor — every 4 hours at :29, summarises new
# conversation context for any ig_thread with inbound activity since its
# last extraction. Builds the same `goals / communication_style /
# running_notes / injuries_limits / personal_context` shape as
# client_memory, so buildMemoryBlock works against either source.
# Extracted memory is injected into the IG-draft prompt for cold leads
# who haven't yet signed up to the app.
[functions."extract-ig-thread-memory"]
  schedule = "29 */4 * * *"

# ManyChat reconciliation backstop - catches IG/FB messages that appear in
# ManyChat Inbox but did not trigger the Default Reply external request.
# Runs every 5 minutes and replays the latest missed input through
# manychat-inbound with an idempotent synthetic message id.
[functions."manychat-reconcile"]
  schedule = "*/5 * * * *"

# Scheduled coach-reply worker — fires Send-later drafts whose timer has
# elapsed. Cadence is every minute so latency between "send in 5 min" and
# actual send is at most ~60 seconds. Function early-returns when nothing is
# due (one cheap status=scheduled query, no further work), so per-minute is
# safe on Netlify's quota. Backed by coach_alerts.scheduled_for + an atomic
# claim flip ('scheduled' -> 'pending') so concurrent runs don't double-fire.
[functions."scheduled-coach-reply-worker"]
  schedule = "* * * * *"

# Prevent caching of service worker so native app always gets latest version
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Prevent Android WebView HTTP cache from serving stale HTML to the service worker
# The SW's Cache API handles offline caching separately — this only affects the HTTP cache layer
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Prevent caching of JS libs so native app always gets latest code
[[headers]]
  for = "/lib/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Prevent caching of dashboard scripts so native app always gets latest code
[[headers]]
  for = "/js/dashboard/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Ensure we redirect legacy URLs
[[redirects]]
  from = "/quiz"
  to = "/quiz.html"
  status = 200

[[redirects]]
  from = "/plantbasedswitch"
  to = "/plantbasedswitch.html"
  status = 200
  
[[redirects]]
  from = "/*"
  to = "/login.html"
  status = 200
  force = false # Only if not exists
