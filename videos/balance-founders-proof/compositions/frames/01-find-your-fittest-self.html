      root.querySelectorAll('[class~="f01-find-your-fittest-self-logo-stroke"]').forEach((stroke) => {
        const length = stroke.getTotalLength();
        stroke.style.strokeDasharray = `${length}`;
        stroke.style.strokeDashoffset = `${length}`;
      });

      const kicker = root.querySelector("#f01-find-your-fittest-self-kicker");

        { t: 0, text: "" },
        { t: 0.09, text: "FIND" },
        { t: 0.28, text: "FIND YOUR" }
      ];
      const kickerDriver = { t: 0 };
      const kickerTextAt = (time) => {
        for (let i = kickerStates.length - 1; i >= 0; i -= 1) {
          if (time >= kickerStates[i].t) return kickerStates[i].text;
        }
        return "";
      };

      tl.fromTo(
        "#f01-find-your-fittest-self-mark",
        { opacity: 0.16, clipPath: "inset(48% 48% 48% 48% round 50%)", scale: 0.96 },

      );
      tl.to(
        '[class~="f01-find-your-fittest-self-logo-stroke"]',
        { strokeDashoffset: 0, duration: 0.64, ease: "power2.out", stagger: 0.46 },
        0.12
      );

        "#f01-find-your-fittest-self-eyebrow",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" },

      );

        "#f01-find-your-fittest-self-kicker",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },
        1.1
      );
      tl.to(
        kickerDriver,
        {
          t: 0.55,
          duration: 0.55,
          ease: "none",
          onUpdate: () => {
            kicker.textContent = kickerTextAt(kickerDriver.t);
          }
        },

      );
      tl.fromTo(
        "#f01-find-your-fittest-self-display",
