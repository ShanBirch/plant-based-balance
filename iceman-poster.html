<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ICEMAN Challenge</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(180deg, #5fb4d4 0%, #79c4dd 100%);
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  .poster {
    color: #ffffff;
    font-weight: 700;
    font-size: clamp(18px, 5.2vw, 56px);
    line-height: 1.7;
    letter-spacing: 0.02em;
    white-space: pre;
    text-shadow: 0 1px 0 rgba(0,0,0,0.08);
    padding: calc(20px + env(safe-area-inset-top, 0px)) 12px calc(20px + env(safe-area-inset-bottom, 0px)) 12px;
    box-sizing: border-box;
  }
  .line {
    display: block;
  }
  .letter {
    background: #1d3a8a;
    color: #ffffff;
    padding: 0.05em 0.18em;
    border-radius: 3px;
    margin: 0 0.02em;
  }
</style>
</head>
<body>
  <div class="poster"><div class="line">      <span class="letter">I</span>S IT TIME</div><div class="line">   TO <span class="letter">C</span>HANGE</div><div class="line"> YOUR <span class="letter">E</span>NERGY?</div><div class="line">      <span class="letter">M</span>OVE WITH US</div><div class="line">      <span class="letter">A</span>ND JOIN THE</div><div class="line">CHALLE<span class="letter">N</span>GE</div></div>
</body>
</html>
