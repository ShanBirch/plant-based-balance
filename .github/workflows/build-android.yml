name: Build Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Java (required for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36
        run: sdkmanager "platforms;android-36"

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✓ google-services.json written — push notifications enabled"
          else
            echo "⚠ GOOGLE_SERVICES_JSON secret not set — push notifications won't work in this build"
          fi

      # Decode keystore from GitHub secret
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/balance-release.jks
          echo "✓ Keystore decoded"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper (not committed to repo)
        working-directory: android
        run: gradle wrapper --gradle-version 8.13 --distribution-type bin

      # Build signed release AAB for Google Play
      - name: Build release AAB
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease

      # Upload AAB artifact for download from GitHub Actions
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: balance-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Also build debug APK for Firebase App Distribution
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitgotchi-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload to Firebase App Distribution
        if: ${{ env.FIREBASE_APP_ID != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          testers: shannonbirch@cocospersonaltraining.com,shannonrhysbirch@gmail.com
          file: android/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: "Build from commit ${{ github.sha }}"
