<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0C0714; }
      #balance-root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="balance-root" data-composition-id="balance-root" data-start="0" data-duration="10" data-fps="30" data-width="1080" data-height="1920">
      <div id="balance-motion-host" class="clip" data-composition-id="balance-motion" data-composition-src="compositions/index.html" data-start="0" data-duration="10" data-track-index="1" data-width="1080" data-height="1920"></div>

      <audio id="audio-quiz-click" class="clip" src=".media/audio/sfx/sfx_002.mp3" data-start="0.35" data-duration="0.4" data-track-index="10" data-volume="0.36"></audio>
      <audio id="audio-community-whoosh" class="clip" src=".media/audio/sfx/sfx_001.mp3" data-start="1.48" data-duration="0.34" data-track-index="11" data-volume="0.2"></audio>
      <audio id="audio-community-click" class="clip" src=".media/audio/sfx/sfx_002.mp3" data-start="1.9" data-duration="0.4" data-track-index="10" data-volume="0.28"></audio>
      <audio id="audio-progress-whoosh" class="clip" src=".media/audio/sfx/sfx_001.mp3" data-start="2.98" data-duration="0.34" data-track-index="11" data-volume="0.2"></audio>
      <audio id="audio-step-one" class="clip" src=".media/audio/sfx/sfx_002.mp3" data-start="3.4" data-duration="0.4" data-track-index="10" data-volume="0.2"></audio>
      <audio id="audio-step-two" class="clip" src=".media/audio/sfx/sfx_002.mp3" data-start="3.78" data-duration="0.4" data-track-index="12" data-volume="0.23"></audio>
      <audio id="audio-step-three" class="clip" src=".media/audio/sfx/sfx_002.mp3" data-start="4.12" data-duration="0.4" data-track-index="10" data-volume="0.34"></audio>
      <audio id="audio-workout-whoosh" class="clip" src=".media/audio/sfx/sfx_001.mp3" data-start="4.48" data-duration="0.34" data-track-index="11" data-volume="0.2"></audio>
      <audio id="audio-workout-click" class="clip" src=".media/audio/sfx/sfx_002.mp3" data-start="6.05" data-duration="0.4" data-track-index="10" data-volume="0.4"></audio>
      <audio id="audio-logo-impact" class="clip" src=".media/audio/sfx/sfx_001.mp3" data-start="7.15" data-duration="0.6" data-track-index="11" data-volume="0.42"></audio>
      <audio id="audio-cta-click" class="clip" src=".media/audio/sfx/sfx_002.mp3" data-start="9.25" data-duration="0.4" data-track-index="10" data-volume="0.18"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const rootTimeline = gsap.timeline({ paused: true });
      window.__timelines["balance-root"] = rootTimeline;
      rootTimeline.seek(0);
    </script>
  </body>
</html>
