<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Balance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a4d2e 0%, #48864B 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
        }

        .logo {
            height: 48px;
            width: auto;
            margin-bottom: 24px;
            border-radius: 50%;
        }

        h1 {
            font-size: 24px;
            color: #1a4d2e;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #f1f5f9;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #48864B;
            background: #f0fdf4;
        }

        .password-requirements {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #48864B;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 20px;
        }

        button:hover {
            background: #3a6346;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(72, 134, 75, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
            display: block;
        }

        .message.error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            display: block;
        }

        .message.info {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
            display: block;
        }

        .back-to-login {
            text-align: center;
            margin-top: 24px;
        }

        .back-to-login a {
            color: #48864B;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-to-login a:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 3px solid #f1f5f9;
            border-top: 3px solid #48864B;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="balance_logo.png" alt="Balance Logo" class="logo">
        <h1>Reset Password</h1>
        <p class="subtitle">Secure your account with a new password</p>

        <form id="resetForm">
            <div class="form-group">
                <label for="password">New Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    required
                    minlength="6"
                >
                <div class="password-requirements">
                    Minimum 6 characters
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="••••••••"
                    required
                    minlength="6"
                >
            </div>

            <button type="submit" id="submitBtn">Update Password</button>

            <div id="message" class="message"></div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>
        </form>

        <div class="back-to-login">
            <a href="/login.html">Back to login</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Initialize Supabase
        const SUPABASE_URL = 'https://hzapaorxqboevxnumxkv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6YXBhb3J4cWJvZXZ4bnVteGt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg2NjA3MTYsImV4cCI6MjA4NDIzNjcxNn0.L8ZuxevbB1pNx2nXtIiiQ-6dZSeqfdGuiEvscljOxq0';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('resetForm');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const messageDiv = document.getElementById('message');
        const loadingDiv = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');

        let sessionReady = false;
        let hasRecoveryIntent = false;
        let invalidLinkTimer = null;
        const RECOVERY_SESSION_FLAG = 'balance_password_recovery_ready';

        // Disable submit until the one-time recovery link has created a session.
        submitBtn.disabled = true;

        // Show message to user
        function showMessage(message, type) {
            messageDiv.textContent = message;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        // Clear message
        function clearMessage() {
            messageDiv.textContent = '';
            messageDiv.className = 'message';
            messageDiv.style.display = 'none';
        }

        function cleanRecoveryUrl() {
            if (window.history && window.history.replaceState) {
                window.history.replaceState({}, document.title, '/reset-password.html');
            }
        }

        function showInvalidLink() {
            showMessage('Invalid or expired reset link. Please request a new one.', 'error');
            setTimeout(() => { window.location.replace('/login.html'); }, 3000);
        }

        // Handle successful auth state change
        function onAuthReady(cleanUrl = false) {
            if (sessionReady) return;
            sessionReady = true;
            if (invalidLinkTimer) {
                clearTimeout(invalidLinkTimer);
                invalidLinkTimer = null;
            }
            if (cleanUrl) {
                try {
                    sessionStorage.setItem(RECOVERY_SESSION_FLAG, '1');
                } catch (e) {
                    console.warn('Could not persist recovery session flag:', e);
                }
                cleanRecoveryUrl();
            }
            submitBtn.disabled = false;
            showMessage('Session verified. You can now reset your password.', 'info');
            setTimeout(clearMessage, 3000);
        }

        // Listen for Supabase auth events
        supabase.auth.onAuthStateChange((event, session) => {
            console.log('Auth event:', event);
            if (event === 'PASSWORD_RECOVERY') {
                hasRecoveryIntent = true;
                onAuthReady(true);
                return;
            }
            if (event === 'SIGNED_IN' && hasRecoveryIntent && session) {
                onAuthReady(true);
            }
        });

        // Handle Supabase reset links from PKCE (?code=), token hash (?token_hash=),
        // and implicit hash (#access_token=...&refresh_token=...) flows.
        async function checkInitialSession() {
            const urlParams = new URLSearchParams(window.location.search);
            const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
            const code = urlParams.get('code');
            const tokenHash = urlParams.get('token_hash') || hashParams.get('token_hash');
            const type = urlParams.get('type') || hashParams.get('type');
            const accessToken = hashParams.get('access_token');
            const refreshToken = hashParams.get('refresh_token');
            let recoverySessionFlag = false;
            try {
                recoverySessionFlag = sessionStorage.getItem(RECOVERY_SESSION_FLAG) === '1';
            } catch (e) {
                console.warn('Could not read recovery session flag:', e);
            }

            hasRecoveryIntent = Boolean(code || tokenHash || accessToken || type === 'recovery' || recoverySessionFlag);

            if (tokenHash && (!type || type === 'recovery')) {
                console.log('Token hash flow: verifying recovery token');
                try {
                    const { error } = await supabase.auth.verifyOtp({
                        token_hash: tokenHash,
                        type: 'recovery'
                    });
                    if (error) {
                        console.error('Token hash verification error:', error);
                        showInvalidLink();
                        return;
                    }
                    onAuthReady(true);
                } catch (err) {
                    console.error('Token hash verification exception:', err);
                    showInvalidLink();
                }
                return;
            }

            if (code) {
                console.log('PKCE flow: exchanging code for session');
                try {
                    const { data, error } = await supabase.auth.exchangeCodeForSession(code);
                    if (error) {
                        console.error('Code exchange error:', error);
                        showInvalidLink();
                        return;
                    }
                    if (!data?.session) {
                        console.warn('Code exchange completed without a session.');
                    }
                    onAuthReady(true);
                } catch (err) {
                    console.error('Code exchange exception:', err);
                    showInvalidLink();
                }
                return;
            }

            if (accessToken && refreshToken) {
                console.log('Implicit flow: setting recovery session from hash');
                try {
                    const { data, error } = await supabase.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });
                    if (error) {
                        console.error('Implicit session error:', error);
                        showInvalidLink();
                        return;
                    }
                    if (!data?.session) {
                        console.warn('Implicit session completed without a session.');
                    }
                    onAuthReady(true);
                } catch (err) {
                    console.error('Implicit session exception:', err);
                    showInvalidLink();
                }
                return;
            }

            if (hasRecoveryIntent) {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    console.log('Recovery session found from Supabase URL bootstrap');
                    onAuthReady(true);
                    return;
                }
            }

            // No code and no hash token — invalid link
            invalidLinkTimer = setTimeout(() => {
                if (!sessionReady) {
                    showMessage('Invalid or expired reset link. Redirecting to login...', 'error');
                    setTimeout(() => { window.location.replace('/login.html'); }, 3000);
                }
            }, 3000);
        }

        checkInitialSession();

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessage();

            if (!sessionReady) {
                showMessage('Reset link is still being verified. Please wait a moment.', 'error');
                return;
            }

            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Validate passwords match
            if (password !== confirmPassword) {
                showMessage('Passwords do not match.', 'error');
                return;
            }

            // Show loading state
            loadingDiv.style.display = 'block';
            submitBtn.disabled = true;

            try {
                const { error } = await supabase.auth.updateUser({
                    password: password
                });

                if (error) {
                    throw error;
                }

                passwordInput.value = '';
                confirmPasswordInput.value = '';
                loadingDiv.style.display = 'none';
                showMessage('Password updated! Redirecting you to the login page...', 'success');
                try {
                    sessionStorage.removeItem(RECOVERY_SESSION_FLAG);
                } catch (e) {
                    console.warn('Could not clear recovery session flag:', e);
                }

                // Clear the recovery session so the next screen is a real login.
                try {
                    const { error: signOutError } = await supabase.auth.signOut();
                    if (signOutError) {
                        console.warn('Sign out error:', signOutError);
                    }
                } catch (signOutError) {
                    console.warn('Sign out exception:', signOutError);
                }

                setTimeout(() => {
                    window.location.replace('/login.html?password_reset=1');
                }, 900);
            } catch (error) {
                console.error('Error updating password:', error);
                showMessage(error.message || 'Failed to update password. Please try again or request a new link.', 'error');
                loadingDiv.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
