<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ICEMAN Challenge - Square</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    background: #1a1a1a;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .frame {
    aspect-ratio: 1 / 1;
    width: min(100vw, 100vh);
    height: auto;
    background: linear-gradient(180deg, #5fb4d4 0%, #79c4dd 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    container-type: size;
    overflow: hidden;
  }
  .poster {
    color: #ffffff;
    font-weight: 700;
    font-size: 4cqw;
    line-height: 1.7;
    letter-spacing: 0.02em;
    white-space: pre;
    -webkit-text-stroke: 1.5px #1d3a8a;
    paint-order: stroke fill;
  }
  .line {
    display: block;
  }
  .letter {
    color: #1d3a8a;
    -webkit-text-stroke: 0;
  }
</style>
</head>
<body>
  <div class="frame"><div class="poster"><div class="line">       <span class="letter">I</span> NEED 6</div><div class="line">       <span class="letter">C</span>OMMITTED</div><div class="line">      V<span class="letter">E</span>GANS/VEGETARIANS TO JOIN</div><div class="line">       <span class="letter">M</span>E IN A</div><div class="line">FREE TR<span class="letter">A</span>NSFORMATION</div><div class="line"> CHALLE<span class="letter">N</span>GE</div></div></div>
</body>
</html>
