  <script>
    (() => {
      const compositionId = "06-daily-community";
      const root = document.querySelector('[data-composition-id="' + compositionId + '"]');
      const header = document.getElementById("f06-header");
      const hub = document.getElementById("f06-hub");
      const camera = document.getElementById("f06-camera");
      const nodes = [
        document.getElementById("f06-food-node"),
        document.getElementById("f06-walk-node"),
        document.getElementById("f06-workout-node")
      ];
      const reactions = [
        document.getElementById("f06-food-reaction"),
        document.getElementById("f06-walk-reaction"),
        document.getElementById("f06-workout-reaction")
      ];
      const feedLabel = document.getElementById("f06-feed-label");
      const feedLabelText = document.getElementById("f06-feed-label-text");
      const payoff = document.getElementById("f06-payoff");

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[compositionId] = tl;

      tl.fromTo(header,
        { y: 34, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
        0.04
      );
      tl.fromTo(hub,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.62, ease: "power3.out" },
        0.34
      );

      const arrivals = [1.20, 2.02, 2.84];
      const orbitScales = [1.04, 0.82, 0.82];

      nodes.forEach((node, index) => {
        const targetX = Number(node.dataset.targetX);
        const targetY = Number(node.dataset.targetY);
        tl.fromTo(node,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.60, opacity: 0 },
          {
            xPercent: -50,
            yPercent: -50,
            x: targetX,
            y: targetY,
            scale: orbitScales[index],
            opacity: 1,
            duration: 0.76,
            ease: "power3.out"
          },
          arrivals[index]
        );
        tl.fromTo(reactions[index],
          { scale: 0, y: 10, opacity: 0 },
          { scale: 1, y: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
          arrivals[index] + 0.34
        );
      });

      tl.to(nodes[0],
        { borderColor: "rgba(169, 111, 0, 0.72)", duration: 0.22, ease: "power2.out" },
        1.54
      );
      tl.to(nodes[0],
        { opacity: 0.80, borderColor: "rgba(169, 111, 0, 0.2)", duration: 0.28, ease: "power2.inOut" },
        2.10
      );
      tl.to(nodes[1],
        { scale: 0.88, borderColor: "rgba(169, 111, 0, 0.72)", duration: 0.22, ease: "power2.out" },
        2.36
      );
      tl.to(nodes[1],
        { scale: 0.82, opacity: 0.80, borderColor: "rgba(169, 111, 0, 0.2)", duration: 0.28, ease: "power2.inOut" },
        2.92
      );
      tl.to(nodes[2],
        { scale: 0.88, borderColor: "rgba(169, 111, 0, 0.72)", duration: 0.22, ease: "power2.out" },
        3.18
      );

      tl.to(camera,
        { scale: 1.04, y: -18, duration: 0.96, ease: "power3.inOut" },
        4.00
      );

      const feedTargets = [
        { x: 0, y: -250 },
        { x: 0, y: 72 },
        { x: 0, y: 394 }
      ];
      nodes.forEach((node, index) => {
        tl.to(node,
          {
            x: feedTargets[index].x,
            y: feedTargets[index].y,
            scale: 0.88,
            opacity: 1,
            borderColor: "rgba(169, 111, 0, 0.2)",
            duration: 0.88,
            ease: "power4.inOut"
          },
          4.02 + index * 0.06
        );
      });
      tl.to(hub,
        { scale: 0.72, y: 16, opacity: 0.34, duration: 0.48, ease: "power3.inOut" },
        4.02
      );

      tl.fromTo(feedLabel,
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" },
        4.22
      );

      const feedStates = [
        { t: 4.30, text: "Meals" },
        { t: 4.50, text: "Meals · walks" },
        { t: 4.70, text: "Meals · walks · workouts" },
        { t: 4.90, text: "Meals · walks · workouts · wins" }
      ];
      const feedDriver = { t: 0 };
      tl.to(feedDriver, {
        t: 6,
        duration: 6,
        ease: "none",
        onUpdate: () => {
          let current = "";
          for (let i = feedStates.length - 1; i >= 0; i -= 1) {
            if (feedDriver.t >= feedStates[i].t) {
              current = feedStates[i].text;
              break;
            }
          }
          feedLabelText.textContent = current;
        }
      }, 0);

      tl.fromTo(payoff,
        { scale: 0.95, filter: "blur(10px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.56, ease: "expo.out" },
        5.20
      );
    })();
