name: Build Balance Teleprompter iOS
# Release retry after the App Store Connect record was created.

on:
  push:
    branches:
      - codex/balance-teleprompter-ios
    paths:
      - apps/balance-teleprompter/**
      - scripts/prepare-balance-teleprompter-apple.mjs
      - scripts/release-balance-teleprompter-ios.mjs
      - .github/workflows/build-balance-teleprompter-ios.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_BUNDLE_ID: com.balance.teleprompter
      APP_TEAM_ID: BPDFP9M7JU

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26 installation was found on the runner."
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Prepare Apple app identity
        id: apple_app
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: node scripts/prepare-balance-teleprompter-apple.mjs

      - name: Install app dependencies
        working-directory: apps/balance-teleprompter
        run: pnpm install --frozen-lockfile

      - name: Build web app and sync iOS
        working-directory: apps/balance-teleprompter
        run: pnpm native:sync

      - name: Install Apple distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          CERT_PATH=$RUNNER_TEMP/distribution.cer
          KEY_PATH=$RUNNER_TEMP/signing_key.pem
          P12_PATH=$RUNNER_TEMP/distribution.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/teleprompter-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$SIGNING_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          openssl x509 -inform DER -in "$CERT_PATH" -out "$RUNNER_TEMP/distribution.pem"
          openssl pkcs12 -export -out "$P12_PATH" -inkey "$KEY_PATH" \
            -in "$RUNNER_TEMP/distribution.pem" -password pass:"$P12_PASSWORD" -legacy

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" /Library/Keychains/System.keychain
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install App Store Connect key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/.private_keys"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            > "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Archive signed iPhone app
        working-directory: apps/balance-teleprompter/ios/App
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/BalanceTeleprompter.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APP_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            TARGETED_DEVICE_FAMILY=1 \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

      - name: Export App Store IPA
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APP_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BalanceTeleprompter.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/teleprompter-export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Validate and upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/teleprompter-export" -maxdepth 1 -name '*.ipa' -type f | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::The exported IPA could not be found."
            exit 1
          fi

          API_PRIVATE_KEYS_DIR="$HOME/.private_keys" xcrun altool --validate-app \
            --type ios --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

          API_PRIVATE_KEYS_DIR="$HOME/.private_keys" xcrun altool --upload-app \
            --type ios --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Configure listing, lifetime purchase, and submit for review
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_SCREENSHOT_DIR: apps/balance-teleprompter/store-listing/app-store-assets
          IOS_BUILD_NUMBER: ${{ github.run_number }}
          SUBMIT_FOR_REVIEW: "true"
        run: node scripts/release-balance-teleprompter-ios.mjs

      - name: Keep the signed IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-teleprompter-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/teleprompter-export/*.ipa
          if-no-files-found: ignore
          retention-days: 30

      - name: Clean up temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/teleprompter-signing.keychain-db" 2>/dev/null || true
