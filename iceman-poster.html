<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICEMAN Challenge</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1a1a;
    font-family: 'Courier New', Courier, monospace;
  }
  .poster {
    width: 100vmin;
    height: 100vmin;
    margin: 0 auto;
    background: linear-gradient(180deg, #5fb4d4 0%, #79c4dd 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    row-gap: 0.6em;
    color: #ffffff;
    font-weight: 700;
    font-size: 8.5vmin;
    letter-spacing: 0.04em;
    line-height: 1;
  }
  .left {
    text-align: right;
    padding-right: 0.15em;
  }
  .right {
    text-align: left;
    padding-left: 0.15em;
  }
  .letter {
    display: inline-block;
    background: #1d3a8a;
    color: #ffffff;
    padding: 0.05em 0.18em;
    min-width: 0.9em;
    text-align: center;
    border-radius: 2px;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="grid">
      <span class="left"></span>
      <span class="letter">I</span>
      <span class="right">S IT TIME</span>

      <span class="left">TO</span>
      <span class="letter">C</span>
      <span class="right">HANGE</span>

      <span class="left">YOUR</span>
      <span class="letter">E</span>
      <span class="right">NERGY?</span>

      <span class="left"></span>
      <span class="letter">M</span>
      <span class="right">OVE WITH US</span>

      <span class="left"></span>
      <span class="letter">A</span>
      <span class="right">ND JOIN THE</span>

      <span class="left">CHALLE</span>
      <span class="letter">N</span>
      <span class="right">GE</span>
    </div>
  </div>
</body>
</html>
