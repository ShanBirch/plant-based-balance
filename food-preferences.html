<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Food you and your family enjoy · Balance</title><style>
:root{color-scheme:light;--paper:#faf6ed;--ink:#252821;--gold:#806527;--card:#fffdf8;--line:#ded5c3}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 system-ui,sans-serif;padding:calc(32px + max(env(safe-area-inset-top,0px),24px)) 20px calc(40px + max(env(safe-area-inset-bottom,0px),24px))}main{max-width:860px;margin:auto}.brand{font-size:14px;letter-spacing:.22em;color:var(--gold)}h1{font:normal clamp(32px,6vw,48px)/1.15 Georgia,serif;margin:14px 0}p{margin:12px 0 26px}fieldset{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:24px;margin:26px 0}legend{font:normal 28px Georgia,serif;padding:0 12px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{display:flex;gap:12px;align-items:center;min-height:54px;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}label:has(input:checked){border-color:var(--gold);background:#f1e8d4}input{width:21px;height:21px;flex-shrink:0;accent-color:var(--gold)}textarea{display:block;width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0 24px;resize:vertical}.extra label{border:0;padding:0;cursor:default}button{font:inherit;border:0;border-radius:10px;padding:14px 22px;background:var(--ink);color:var(--card);cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.note{font-size:14px}#result{white-space:pre-wrap;border-left:3px solid var(--gold);padding-left:18px}@media(max-width:500px){.choices{grid-template-columns:1fr}fieldset{padding:16px}body{padding-left:16px;padding-right:16px}}

const form=document.querySelector('#foods'),result=document.querySelector('#result'),button=document.querySelector('#submit');let submitting=false;
form.addEventListener('submit',async event=>{event.preventDefault();if(submitting)return;if(!form.querySelector('input[type="checkbox"]:checked')&&!document.querySelector('#other-foods').value.trim()){result.textContent='Please tick some foods you enjoy or add your own below.';result.focus();return}submitting=true;button.disabled=true;button.textContent='Sending…';result.textContent='';const fields=new FormData(form);for(const name of ['breakfast','lunch','dinner','snacks']){const values=fields.getAll(name);fields.delete(name);fields.set(name,values.join(', ')||'No choices selected')}try{const response=await fetch('/food-preferences',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(fields).toString()});if(!response.ok)throw new Error('Submission failed');form.hidden=true;result.textContent='Thanks, your food preferences have been received. Shannon will use them to update your meal plan and let you know when it is ready.';result.focus()}catch(error){result.textContent='Your answers could not be sent. Please try again. Your choices are still here.';result.focus();button.disabled=false;button.textContent='Send my food preferences';submitting=false}});
